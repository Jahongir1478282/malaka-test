<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Test Tizimi</title>
    <style>
        /* CSS o'zgarishsiz qoladi */
        :root { --primary-color: #4a90e2; --secondary-color: #f5f6fa; --text-color: #2f3640; --success-color: #2ecc71; --danger-color: #e74c3c; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #dcdde1; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background-color: white; width: 90%; max-width: 600px; border-radius: 15px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--secondary-color); padding-bottom: 10px; margin-bottom: 20px; }
        .header h1 { font-size: 24px; color: var(--primary-color); margin: 0; }
        .score-box { font-weight: bold; color: var(--text-color); }
        .question-text { font-size: 18px; font-weight: 600; color: var(--text-color); margin-bottom: 15px; line-height: 1.5; }
        .answer-buttons { display: flex; flex-direction: column; gap: 10px; }
        .btn { background-color: white; border: 2px solid var(--primary-color); border-radius: 8px; padding: 12px; font-size: 16px; color: var(--text-color); cursor: pointer; transition: all 0.3s ease; text-align: left; }
        .btn:hover:not([disabled]) { background-color: var(--primary-color); color: white; }
        .btn:disabled { cursor: no-drop; }
        .btn.correct { background-color: var(--success-color); border-color: var(--success-color); color: white; }
        .btn.wrong { background-color: var(--danger-color); border-color: var(--danger-color); color: white; }
        .controls { display: flex; justify-content: flex-end; margin-top: 20px; }
        #next-btn { background-color: var(--primary-color); color: white; border: none; padding: 10px 25px; border-radius: 5px; font-size: 16px; cursor: pointer; display: none; }
        .result-screen { text-align: center; display: none; }
        
        /* Loading indikatori uchun stil */
        #loading { text-align: center; color: var(--primary-color); font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>

    <h1>Online Test Tizimi</h1>
</body>
</html>
